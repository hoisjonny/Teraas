<style>
/* Layout: één kolom op telefoonbreedte. Kop met stek en vissoort, inhoud als kaarten, tabbalk onderin.
   Kleuren komen van de snoek zelf: olijfgroene flank, lichte vlekken, oranjerode vinnen, polderwater. */
:root{
  --schaduw:0 1px 2px rgba(22,33,27,.04),0 10px 22px -16px rgba(22,33,27,.32);
  --bg:#EDF0EA; --surface:#FBFCF9; --surface-2:#E3E8DE; --ink:#16211B; --ink-2:#4F5E54; --line:#CFD7CA;
  --pike:#3F5B2A; --pike-ink:#FFFFFF; --fin:#B9481A; --water:#2A6A8A;
  --s-top:#2B7A4B; --s-goed:#5E8A22; --s-matig:#B0750A; --s-lastig:#B0432B;
  --f-display:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --schaduw:none;
    --bg:#0F1512; --surface:#18211C; --surface-2:#232E27; --ink:#E6ECE4; --ink-2:#9DAB9F; --line:#2F3B33;
    --pike:#A9BE6B; --pike-ink:#10160F; --fin:#F08A4B; --water:#6DB5D6;
    --s-top:#58C283; --s-goed:#A8CC5A; --s-matig:#E5B040; --s-lastig:#EB7B5E;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--fin);outline-offset:2px}

/* kop */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.brand{display:flex;align-items:center;gap:8px;font:800 21px/1 var(--f-display);letter-spacing:-.01em;color:var(--pike);flex:none}
.mark{width:34px;height:34px;border-radius:9px;flex:none;overflow:hidden;box-shadow:0 1px 3px rgba(8,30,22,.35)}
.stekbtn{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0;padding:7px 10px 7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.stekbtn{flex:0 1 auto}
.stekbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;min-width:0}
.stekbtn svg{flex:none;color:var(--ink-2)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);flex:none}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--pike);border-color:var(--pike);color:var(--pike-ink)}
.chip i{font:700 12px/1 var(--f-data);font-style:normal;padding:3px 5px;border-radius:6px;background:var(--surface-2);color:var(--c,var(--ink-2));min-width:26px;text-align:center}
.chip[aria-pressed="true"] i{background:color-mix(in srgb,var(--pike-ink) 18%,transparent);color:var(--pike-ink)}

/* algemene blokken */
main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--schaduw)}
/* onderwaterkaart: het vaste beeldmerk bovenaan elk scherm, in beide thema's hetzelfde */
.card.water{position:relative;overflow:hidden;border:0;color:#F2F6EE;padding:16px;
  background:radial-gradient(110% 80% at 88% -12%,rgba(120,205,160,.55) 0%,transparent 58%),linear-gradient(180deg,#27694f 0%,#174537 55%,#0d2b24 100%);
  --ink:#F2F6EE;--ink-2:#BCD0C2;--line:rgba(255,255,255,.18);--surface:#1c4a3b;--surface-2:rgba(255,255,255,.17);--fin:#FFB889;
  --s-top:#73E2A3;--s-goed:#C6E66F;--s-matig:#F6C758;--s-lastig:#FF9A80;
  box-shadow:0 12px 26px -14px rgba(9,40,30,.7)}
.card.water>*{position:relative}
.card.water>.snoek{position:absolute;right:-22px;bottom:-4px;width:78%;height:auto;opacity:.09;pointer-events:none}
.card.water>.straal{position:absolute;inset:0;width:100%;height:100%;opacity:.07;pointer-events:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h2{font:800 22px/1.15 var(--f-display);text-wrap:balance}
h3{font:700 16px/1.2 var(--f-display);text-wrap:balance}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.top-c{--c:var(--s-top)} .goed-c{--c:var(--s-goed)} .matig-c{--c:var(--s-matig)} .lastig-c{--c:var(--s-lastig)}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 13px/1 var(--f-data);padding:5px 7px;border-radius:8px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--bc) 45%,var(--line));background:color-mix(in srgb,var(--bc) 10%,var(--surface));font-size:14px}
.banner b{display:block}
.banner svg{flex:none;color:var(--bc);margin-top:1px}
.banner.warn{--bc:var(--s-lastig)} .banner.info{--bc:var(--water)} .banner.tip{--bc:var(--s-matig)}
.linkbtn{color:var(--fin);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--pike);color:var(--pike-ink);font-weight:700}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--s-lastig) 16%,var(--surface));color:var(--s-lastig)}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* hero */
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.gauge{width:150px}
.gauge svg{display:block;width:100%;height:auto}
.gauge .trk{stroke:var(--surface-2)} .gauge .val{stroke:var(--c);transition:stroke-dasharray .5s ease}
.gauge text{fill:var(--ink);font-family:var(--f-display);font-weight:800}
.gauge .unit{fill:var(--ink-2);font:600 11px var(--f-body)}
.verdict{color:var(--c);font:800 28px/1 var(--f-display)}
.hero p.why{margin-top:6px;font-size:14px}
.best{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.best b{font-family:var(--f-data);font-variant-numeric:tabular-nums}
@media (max-width:359px){.hero{grid-template-columns:1fr}.gauge{margin:0 auto}}

/* uurstrook */
.strip{display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:10px}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:5px;position:relative;min-width:0}
.bar.nacht{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.bar span{display:block;width:100%;height:var(--h);min-height:3px;border-radius:4px;background:var(--c);opacity:.85}
.bar.past span{opacity:.3}
.bar.sel{outline:2px solid var(--ink);outline-offset:1px}
.bar.nu::after{content:"";position:absolute;left:50%;top:-7px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--fin)}
.axis{display:flex;gap:2px;margin-top:4px;font:11px/1 var(--f-data);color:var(--ink-2)}
.axis span{flex:1;text-align:center;min-width:0;overflow:visible;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.legend .dot{border-radius:50%;background:var(--fin)}

/* tegels */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;min-width:0;box-shadow:var(--schaduw)}
.tile .k{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.tile .k svg{flex:none;color:var(--pike);opacity:.85}
.tile.water .k svg{color:var(--water)}
.tile .v{font:700 21px/1.2 var(--f-display);margin-top:3px;font-variant-numeric:tabular-nums}
.tile .v small{font:600 13px var(--f-body);color:var(--ink-2)}
.tile .s{font-size:13px;color:var(--ink-2);margin-top:1px}
.tile.water .v{color:var(--water)}
.up{color:var(--s-top)} .down{color:var(--s-lastig)}

/* factoren */
.factor{padding:11px 0;border-top:1px solid var(--line)}
.factor:first-of-type{border-top:0;padding-top:4px}
.factor-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.factor-h b{font-weight:700}
.factor-h span{font:600 13px var(--f-data);color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.meter{height:6px;border-radius:3px;background:var(--surface-2);margin:7px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:3px;background:var(--c)}
.factor p{font-size:13.5px;color:var(--ink-2)}

/* advies */
.adv{display:flex;flex-direction:column;gap:6px}
.adv .kop{font:800 19px/1.2 var(--f-display)}
.adv ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.adv li{font-size:14.5px}
.lure{display:flex;align-items:center;gap:10px;margin-top:6px;padding:9px 11px;border-radius:12px;background:var(--surface-2);font-size:14px}
.lure .sw{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.sw.natuurlijk{background:linear-gradient(135deg,#6f7f4a,#c9b98a)} .sw.licht{background:linear-gradient(135deg,#ffffff,#b8c4cc)} .sw.fel{background:linear-gradient(135deg,#e6e21f,#f07a1a)}
.pauze{display:flex;align-items:baseline;gap:8px;font:800 30px/1 var(--f-display);color:var(--fin);font-variant-numeric:tabular-nums}
.pauze small{font:600 14px var(--f-body);color:var(--ink-2)}

/* week */
.day{display:block;width:100%;text-align:left;padding:13px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day-h{display:flex;align-items:center;gap:10px}
.day-h .dn{font:700 16px var(--f-display);display:inline-block}
.cap::first-letter{text-transform:uppercase}
.day-h .bw{margin-left:auto;font:600 13px var(--f-data);color:var(--ink-2);font-variant-numeric:tabular-nums}
.day-m{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.day-s{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{font:600 11px/1 var(--f-data);padding:4px 6px;border-radius:6px;color:var(--ink-2);background:var(--surface-2)}
.mini b{color:var(--c)}

/* logboek + lijsten */
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:700}
.item .m{font-size:13px;color:var(--ink-2)}
.x{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:13px}
.x.sure{background:var(--s-lastig);color:#fff}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 20px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--schaduw)}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;font:700 16px var(--f-display);cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.det{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.det p,.det li{font-size:14px}
.det ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border-top:0}
.scroll-x{overflow-x:auto}

/* formulieren */
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}
input,select,textarea{font-size:16px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
label.check{flex-direction:row;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
label.check input{width:20px;height:20px;flex:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(8,14,10,.5)}
.sheet-in{width:100%;max-width:560px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 6px;font-size:10.5px;font-weight:700;color:var(--ink-2);min-width:0}
.tab svg{box-sizing:content-box;padding:3px 12px;border-radius:999px}
.tab[aria-current="page"]{color:var(--pike)}
.tab[aria-current="page"] svg{background:color-mix(in srgb,var(--pike) 17%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
.empty{text-align:center;padding:26px 10px;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
/* feest bij een vangst */
.feest{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(6,18,13,.62);animation:feestIn .18s ease both}
.feest canvas{position:absolute;inset:0;width:100%;height:100%}
.feest div{position:relative;text-align:center;padding:0 16px}
.feest b{display:block;font:800 clamp(46px,16vw,92px)/1 var(--f-display);color:#fff;text-shadow:0 4px 0 #C4501B,0 12px 34px rgba(0,0,0,.55);animation:feestPop .55s cubic-bezier(.2,1.6,.4,1) both}
.feest span{display:block;margin-top:14px;font:700 18px/1.2 var(--f-display);color:#F1EBD0;animation:feestIn .4s .25s ease both}
@keyframes feestIn{from{opacity:0}to{opacity:1}}
@keyframes feestPop{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
/* kaart */
#kaart{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.mapbox{position:relative;z-index:0;isolation:isolate;height:min(56dvh,460px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
#map{position:absolute;inset:0}
.leaflet-container{font:inherit;background:var(--surface-2)}
.cross{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:none;z-index:500}
.cross::before,.cross::after{content:"";position:absolute;background:var(--fin);box-shadow:0 0 0 1px #fff}
.cross::before{left:11px;top:0;width:2px;height:24px}.cross::after{top:11px;left:0;height:2px;width:24px}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#3F5B2A;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.actief{background:#D2541D}
.peil-lbl{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;font:700 11px/1 var(--f-data);color:#fff!important;text-shadow:0 0 2px #06202d,0 0 2px #06202d}
.peil-lbl::before{display:none!important}
.ramp{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.ramp i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.groep{margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   MODEL — puur rekenwerk: watertemperatuur schatten en vis-score bepalen
   ===================================================================== */
const Model = (() => {
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  // lineaire opzoektabel [[x,y],...]
  function lut(tab, x) {
    if (x <= tab[0][0]) return tab[0][1];
    for (let i = 1; i < tab.length; i++) {
      if (x <= tab[i][0]) { const a = tab[i - 1], b = tab[i]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); }
    }
    return tab[tab.length - 1][1];
  }

  // Hoe traag volgt het water de lucht? tau = tijdconstante in uren, k = opwarming door zon (°C per W/m²).
  const WATER = {
    sloot:     { naam: 'Sloot',             tau: 36,  k: 0.012, diepte: 1.5 },
    vaart:     { naam: 'Vaart / kanaal',    tau: 84,  k: 0.010, diepte: 2.5 },
    plas:      { naam: 'Plas / klein meer', tau: 168, k: 0.008, diepte: 3 },
    grootmeer: { naam: 'Groot meer',        tau: 240, k: 0.006, diepte: 3.5 }
  };

  const WIND_ROOF = [[0,.6],[6,.85],[12,1],[19,1],[28,.9],[38,.65],[49,.35],[61,.12],[75,.05]];
  const WIND_VREDE = [[0,.8],[6,.95],[19,1],[28,.85],[38,.55],[49,.3],[61,.1],[75,.05]];

  const SPECIES = {
    snoek: {
      naam: 'Snoek', uren: 'dag', lw: [8, 14],
      temp: [[0,.12],[2,.25],[4,.45],[6,.68],[8,.9],[10,1],[15,1],[18,.8],[20,.6],[22,.35],[25,.15]],
      cloud: [[0,.55],[30,.7],[60,.9],[80,1],[100,.95]], wind: WIND_ROOF,
      koud: { preNight:.12, dawn:.55, dayEdge:.72, dayPeak:1,   dusk:.82, earlyNight:.15, deepNight:.08 },
      warm: { preNight:.2,  dawn:1,   dayEdge:.72, dayPeak:.5,  dusk:.95, earlyNight:.22, deepNight:.1 },
      w: { temp:.28, trend:.17, druk:.13, licht:.17, wolk:.08, wind:.12, regen:.05 }
    },
    snoekbaars: {
      naam: 'Snoekbaars', uren: 'ruim', lw: [8, 14],
      temp: [[0,.12],[4,.3],[6,.48],[8,.68],[10,.85],[12,1],[22,1],[25,.7],[28,.4]],
      cloud: [[0,.45],[50,.7],[80,.95],[100,1]],
      wind: [[0,.55],[6,.75],[12,.95],[20,1],[28,1],[38,.75],[49,.4],[61,.12],[75,.05]],
      koud: { preNight:.5,  dawn:.8, dayEdge:.5,  dayPeak:.55, dusk:1, earlyNight:.85, deepNight:.4 },
      warm: { preNight:.8,  dawn:.9, dayEdge:.35, dayPeak:.3,  dusk:1, earlyNight:1,   deepNight:.75 },
      w: { temp:.25, trend:.13, druk:.12, licht:.25, wolk:.07, wind:.13, regen:.05 }
    },
    baars: {
      naam: 'Baars', uren: 'dag', lw: [8, 14],
      temp: [[0,.12],[4,.35],[6,.52],[8,.7],[10,.9],[12,1],[20,1],[23,.75],[26,.45]],
      cloud: [[0,.75],[40,.9],[100,.92]], wind: WIND_ROOF,
      koud: { preNight:.08, dawn:.6, dayEdge:.75, dayPeak:.95, dusk:.8,  earlyNight:.1,  deepNight:.05 },
      warm: { preNight:.12, dawn:1,  dayEdge:.8,  dayPeak:.65, dusk:.95, earlyNight:.15, deepNight:.06 },
      w: { temp:.28, trend:.15, druk:.14, licht:.18, wolk:.05, wind:.14, regen:.06 }
    },
    karper: {
      naam: 'Karper', uren: 'alles', lw: [10, 16],
      temp: [[0,.04],[4,.12],[6,.2],[8,.33],[10,.5],[12,.68],[15,.9],[17,1],[24,1],[27,.7],[30,.4]],
      cloud: [[0,.85],[50,.92],[100,.92]], wind: WIND_VREDE,
      koud: { preNight:.3, dawn:.45, dayEdge:.7, dayPeak:.95, dusk:.75, earlyNight:.45, deepNight:.3 },
      warm: { preNight:.9, dawn:1,   dayEdge:.6, dayPeak:.45, dusk:.9,  earlyNight:.9,  deepNight:.8 },
      w: { temp:.34, trend:.18, druk:.12, licht:.14, wolk:.03, wind:.12, regen:.07 }
    },
    witvis: {
      naam: 'Witvis', uren: 'alles', lw: [9, 15],
      temp: [[0,.1],[4,.28],[6,.45],[8,.6],[10,.75],[13,.9],[15,1],[22,1],[25,.75],[28,.5]],
      cloud: [[0,.8],[50,.92],[100,.92]], wind: WIND_VREDE,
      koud: { preNight:.2,  dawn:.5, dayEdge:.72, dayPeak:.95, dusk:.75, earlyNight:.3,  deepNight:.18 },
      warm: { preNight:.65, dawn:1,  dayEdge:.65, dayPeak:.5,  dusk:.95, earlyNight:.75, deepNight:.55 },
      w: { temp:.30, trend:.18, druk:.12, licht:.16, wolk:.04, wind:.13, regen:.07 }
    }
  };

  const TREND_KOUD = [[-4,.12],[-2,.3],[-1,.48],[-.4,.64],[0,.74],[.5,.86],[1.5,1],[5,1]];
  const TREND_WARM = [[-4,1],[-1,.95],[0,.72],[1,.5],[3,.25]];
  const TREND_MID  = [[-4,.4],[-2,.55],[-.7,.75],[0,.88],[1,.95],[2.5,.85],[5,.7]];
  const DRUK = [[-7,.45],[-4,.75],[-2.5,.95],[-1.2,1],[-.4,.9],[.2,.8],[.8,.68],[1.8,.5],[3,.36],[6,.3]];
  const REGEN = [[0,1],[.3,1],[1,.85],[2.5,.6],[5,.35],[10,.2]];

  function build(wx, stek, cal) {
    const H = wx.hourly, n = H.time.length, tz = wx.timezone || 'Europe/Amsterdam';
    const wt = WATER[stek.type] || WATER.sloot;
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
    const parts = ts => { const o = {}; for (const p of fmt.formatToParts(new Date(ts * 1000))) o[p.type] = p.value; return o; };
    const key = new Array(n), hr = new Array(n);
    for (let i = 0; i < n; i++) { const p = parts(H.time[i]); key[i] = p.year + '-' + p.month + '-' + p.day; hr[i] = (+p.hour) % 24; }

    // zon op/onder per lokale dag
    const sun = {};
    const D = wx.daily || {};
    if (D.sunrise) for (let d = 0; d < D.sunrise.length; d++) {
      if (D.sunrise[d] == null || D.sunset[d] == null) continue;
      const p = parts(D.sunrise[d]); sun[p.year + '-' + p.month + '-' + p.day] = { sr: D.sunrise[d], ss: D.sunset[d] };
    }

    const num = (arr, i, alt) => (arr && arr[i] != null ? arr[i] : alt);
    const Ta = new Float64Array(n), P = new Float64Array(n), wind = new Float64Array(n), gust = new Float64Array(n),
      dir = new Float64Array(n), cloud = new Float64Array(n), rain = new Float64Array(n), pop = new Float64Array(n),

const RWS = 'https://geo.rijkswaterstaat.nl/services/ogc/gdr/bodemhoogte_1mtr_historie/ows';

    const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(c);
    const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('kaart')); }; document.head.appendChild(s);

async function toonKaart() {

function kaartInit() {

function kaartTeken() {

async function laagZet(k, aan) {
  K.aan[k] = aan; if (!K.map) return;

      const n = [...x.matchAll(/<Name>(?:[\w-]+:)?(bodemhoogte_1mtr_\d{6})<\/Name>/g)].map(m => m[1]).sort();
      if (n.length) K.rwsLaag = n[n.length - 1];

// vuurwerk en "Let's go!" bij een gelogde vis
function feest(regel) {
  const el = document.createElement('div'); el.className = 'feest'; el.setAttribute('role', 'status');
  el.innerHTML = '<canvas></canvas><div><b>Let\u2019s go!</b>' + (regel ? '<span>' + esc(regel) + '</span>' : '') + '</div>';
  document.body.appendChild(el);
  const rustig = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf = 0, klaar = false;
  const weg = () => { if (klaar) return; klaar = true; cancelAnimationFrame(raf); el.remove(); };
  el.addEventListener('click', weg);
  setTimeout(weg, rustig ? 2000 : 3800);
  if (rustig) return;
  const cv = el.querySelector('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1), W = el.clientWidth, H = el.clientHeight, ctx = cv.getContext('2d');
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const kleuren = ['#F0822C', '#E3E52A', '#73E2A3', '#FFFFFF', '#6DB5D6', '#FF9A80', '#F6C758'], pijlen = [], vonken = [];
  const t0 = performance.now(); let vorige = t0, volgende = 0;
  const knal = (x, y) => { const k = kleuren[Math.floor(Math.random() * kleuren.length)], n = 54 + Math.floor(Math.random() * 30); for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 240; vonken.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, d: .55 + Math.random() * .6, k: Math.random() < .15 ? '#FFFFFF' : k }); } };
  const stap = nu_ => {
    const dt = Math.min(.05, (nu_ - vorige) / 1000), t = (nu_ - t0) / 1000; vorige = nu_;
    if (t < 2.6 && t >= volgende) { volgende = t + .16 + Math.random() * .22; pijlen.push({ x: W * (.12 + Math.random() * .76), y: H + 10, vy: -(H * (.75 + Math.random() * .45)), top: H * (.12 + Math.random() * .38) }); }
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = pijlen.length - 1; i >= 0; i--) { const p = pijlen[i]; p.y += p.vy * dt; ctx.fillStyle = '#FFE9B8'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); if (p.y <= p.top) { knal(p.x, p.y); pijlen.splice(i, 1); } }
    for (let i = vonken.length - 1; i >= 0; i--) { const v = vonken[i]; v.vx *= (1 - 1.6 * dt); v.vy = v.vy * (1 - 1.6 * dt) + 150 * dt; v.x += v.vx * dt; v.y += v.vy * dt; v.l -= dt / v.d; if (v.l <= 0) { vonken.splice(i, 1); continue; } ctx.globalAlpha = Math.max(0, v.l); ctx.fillStyle = v.k; ctx.beginPath(); ctx.arc(v.x, v.y, 1.4 + 1.6 * v.l, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (!klaar) raf = requestAnimationFrame(stap);

  raf = requestAnimationFrame(stap);
}
let toastT;

  wegStek(el) { if (!twee(el.dataset.id)) return render(); S.stekken = S.stekken.filter(s => s.id !== el.dataset.id); delete S.cal[el.dataset.id]; if (!S.stekken.some(s => s.id === S.actief)) S.actief = S.stekken[0].id; UI.sheet = null; UI.bewerk = null; bewaar(); M = null; laad(); },

  ijkWeg() { delete S.cal[stek().id]; bewaar(); herbouw(); toast('IJking gewist.'); renderMeer(); },

  kiesKaart(el) { S.actief = el.dataset.id; K.voor = S.actief; UI.sel = null; M = null; bewaar(); toast('Stek gekozen.'); laad(); },
  verplaats(el) { if (!K.map) return; const s = S.stekken.find(a => a.id === el.dataset.id), c = K.map.getCenter(); s.lat = +c.lat.toFixed(4); s.lon = +c.lng.toFixed(4); bewaar(); toast('Stek verplaatst.'); if (s.id === S.actief) { M = null; laad(); } else render(); },
  stekHier() { if (!K.map) return toast('De kaart is nog niet geladen.'); const c = K.map.getCenter(); UI.bewerk = { naam: '', lat: +c.lat.toFixed(4), lon: +c.lng.toFixed(4), type: 'sloot', helder: 'normaal', diepte: '', ijs: false }; UI.zoek = []; UI.sheet = 'stekForm'; render(); },
  wegPeil(el) { if (!twee(el.dataset.id)) return render(); S.peil = S.peil.filter(p => p.id !== el.dataset.id); K.sel = null; bewaar(); render(); },
  telReken() { const n = parseFloat($('#pN').value), v = parseFloat($('#pV').value); if (n > 0 && v > 0) $('#pD').value = (n * v).toFixed(1); else toast('Vul in tot hoeveel je telde.'); },
  async zoek() {
    const q = ($('#sZ').value || '').trim(); if (q.length < 2) return toast('Typ een plaatsnaam.');
    vasthouden();
    try { const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=nl&name=' + encodeURIComponent(q)); const j = await r.json(); UI.zoek = j.results || []; if (!UI.zoek.length) toast('Niets gevonden voor "' + q + '".'); }
    catch (e) { UI.zoek = []; toast('Zoeken lukte niet. Vul de coördinaten zelf in.'); }

      () => toast('Geen toegang tot je locatie. Zoek op plaatsnaam.'), { timeout: 10000, maximumAge: 600000 });

function vasthouden() { // formulierwaarden van de stek bewaren tijdens zoeken
  const f = document.querySelector('form[data-f="stek"]'); if (!f) return;

const FORM = {

    if (M) { const i = Model.nuIndex(M, t); if (i >= 0 && i < M.n - 1 && t / 1000 - M.t[i] < 3600) { const k = SP[soort] ? soort : S.soort, F = Model.factors(M, i, k); e.c = { tw: +M.Tw[i].toFixed(1), d3: +F.d3.toFixed(1), p: Math.round(M.P[i]), dp3: +F.dp3.toFixed(1), bft: bft(M.wind[i]), wr: windr(M.dir[i]), cl: Math.round(M.cloud[i]), score: F.score, fase: M.phase[i] }; } }

  aas(d) { S.tackle.push({ id: uid('t'), naam: d.get('naam').trim(), soort: d.get('soort'), kleur: d.get('kleur'), gram: +d.get('gram') || null, diepte: (d.get('diepte') || '').trim() }); bewaar(); UI.sheet = null; toast('Toegevoegd aan je aasdoos.'); renderMeer(); },
